<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-12 pr-4 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-sm" placeholder="name@domain.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-xs">
<label class="font-label-caps text-label-caps text-outline uppercase ml-1">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-12 pr-4 text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-sm" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
</div>

<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-full active:scale-95 transition-transform blue-glow">
                    Log In
                </button>
<div class="flex items-center justify-center space-x-base py-xs">
<div class="h-px w-full bg-outline-variant"></div>
<span class="font-label-caps text-label-caps text-outline px-md">OR</span>
<div class="h-px w-full bg-outline-variant"></div>
</div>
<button class="w-full bg-surface-container-high border border-outline-variant text-on-surface font-headline-md text-headline-md py-4 rounded-full active:scale-95 transition-transform hover:bg-surface-variant transition-colors">

</div>
